<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="SVMCheck architecture. A user-mode controller (SvmHvCtl) talks over a versioned, administrator-only IOCTL interface to the SVMCheck kernel driver. The driver has six modules: Svm, Processor, Vm, Memory, Guest and Hv. It enters an isolated synthetic guest with VMRUN and regains control on each VMEXIT; the guest uses nested page tables and reserved CPUID hypercalls.">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4d8dff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
