<rect x="46.5" y="90.5" width="226" height="74" rx="8" fill="#0e1218" stroke="#27313d"/><text x="60" y="116" fill="#eceff3" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="600">SvmHvCtl.exe</text><text x="60" y="136" fill="#8b98a8" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="11.5">status · read · negtest</text>
<text x="46" y="206" fill="#8b98a8" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5">Elevated controller.</text><text x="46" y="226" fill="#8b98a8" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5">Needs no WDK headers: the</text><text x="46" y="246" fill="#8b98a8" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5">ABI header has no kernel</text><text x="46" y="266" fill="#8b98a8" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5">dependency.</text>
<rect x="346.5" y="90.5" width="520" height="74" rx="8" fill="#0e1218" stroke="#ff2bd6"/><text x="360" y="116" fill="#eceff3" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="600">\\.\SvmHv  (Administrators + SYSTEM only)</text><text x="360" y="136" fill="#8b98a8" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="11.5">versioned IOCTL ABI · QUERY_STATUS · READ_GPA</text>
