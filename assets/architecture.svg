<rect x="346.5" y="296.5" width="256" height="76" rx="8" fill="#0e1218" stroke="#27313d"/><text x="360" y="322" fill="#eceff3" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="600">Processor</text><text x="360" y="342" fill="#8b98a8" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="11.5">per-CPU state, pinning</text>
<rect x="610.5" y="296.5" width="256" height="76" rx="8" fill="#0e1218" stroke="#27313d"/><text x="624" y="322" fill="#eceff3" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="600">Memory</text><text x="624" y="342" fill="#8b98a8" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="11.5">nested page tables, fixup</text>
