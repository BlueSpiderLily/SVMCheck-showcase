<rect x="610.5" y="392.5" width="256" height="76" rx="8" fill="#0e1218" stroke="#27313d"/><text x="624" y="418" fill="#eceff3" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="600">Hv</text><text x="624" y="438" fill="#8b98a8" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="11.5">device, ABI, stats</text>
<path d="M606 164V200" stroke="#7aa8ff" stroke-width="1.6" marker-end="url(#ah)" fill="none"/>
<rect x="346.5" y="496.5" width="520" height="58" rx="8" fill="#0a0c10" stroke="#1c242d" stroke-dasharray="4 4"/><text x="362" y="520" fill="#c9d1db" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14">Policy code is pure, header-only C++ with no WDK types,</text><text x="362" y="540" fill="#c9d1db" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14">so it is unit-tested on the host without loading a driver.</text>
<text x="940" y="96" fill="#8b98a8" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5">Each #VMEXIT is decoded and</text><text x="940" y="116" fill="#8b98a8" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5">recovered by the host. Unknown</text><text x="940" y="136" fill="#8b98a8" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5">exits fail closed.</text>
<rect x="940.5" y="200.5" width="214" height="92" rx="8" fill="#0e1218" stroke="#4d8dff"/><text x="954" y="226" fill="#eceff3" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="600">Synthetic guest</text><text x="954" y="246" fill="#8b98a8" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="11.5">isolated · runs in bursts</text>
<text x="954" y="278" fill="#8b98a8" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5">Windows is never the guest</text>
<rect x="940.5" y="336.5" width="214" height="80" rx="8" fill="#0e1218" stroke="#4d8dff"/><text x="954" y="362" fill="#eceff3" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="600">Nested page tables</text><text x="954" y="382" fill="#8b98a8" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="11.5">windows · ceilings · splits</text>
