<rect x="24.5" y="24.5" width="270" height="552" rx="12" fill="#0a0c10" stroke="#1c242d"/><text x="44" y="54" fill="#7d8794" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace" font-size="12" letter-spacing="2.4">USER MODE</text><rect x="24.5" y="24.5" width="270" height="2" rx="1" fill="url(#g)" opacity="0.8"/>
